<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE — the world, right now</title>
<style>
  :root{
    --bg: #0a0d0c;
    --bg-panel: #101413;
    --line: #1e2523;
    --ink: #e8ede9;
    --ink-dim: #6f7b76;
    --amber: #ffb454;
    --teal: #4fd6c4;
    --coral: #ff6b5e;
    --violet: #b18cff;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

  /* header */
  .head{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:16px; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; letter-spacing: 0.14em; font-size: 13px; font-weight:600; }
  .brand svg{ display:block; }
  .about{ font-size:11px; letter-spacing:0.12em; color:var(--ink-dim); }

  .tabs{ display:flex; gap:22px; }
  .tab{
    background:none; border:none; color:var(--ink-dim); font: inherit;
    font-size:11px; letter-spacing:0.14em; cursor:pointer; padding:0 0 6px;
    border-bottom:2px solid transparent;
  }
  .tab.active{ color: var(--teal); border-bottom-color: var(--teal); }
  .tab:hover{ color: var(--ink); }

  .hero{ text-align:center; padding: 46px 0 30px; }
  .hero h1{
    font-size: clamp(26px, 5vw, 42px); margin: 0 0 8px; letter-spacing: 0.02em; font-weight: 700;
  }
  .hero p{ color:var(--ink-dim); margin:0 0 30px; font-size:14px; }

  .clock{
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(40px, 10vw, 76px); font-weight: 500; letter-spacing: 0.02em;
    color: var(--amber);
  }
  .clock .tz{ font-size: 15px; color: var(--ink-dim); font-family: inherit; margin-left:8px; letter-spacing:0.1em; }
  .date-row{ margin-top:6px; color:var(--ink-dim); font-size:13px; letter-spacing:0.08em; }
  .live{ display:inline-flex; align-items:center; gap:6px; margin-top:10px; font-size:11px; letter-spacing:0.16em; color: var(--teal); }
  .live .dot{ width:6px; height:6px; border-radius:50%; background:var(--teal); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:0.25} }

  /* population block */
  .population{ margin-top: 34px; padding-top: 26px; border-top: 1px solid var(--line); text-align:center; }
  .population .label{ font-size:11px; letter-spacing:0.16em; color:var(--ink-dim); text-transform:uppercase; }
  .population .icon{ display:inline-block; margin: 0 0 6px; font-size:20px; }
  .population .value{
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(38px, 8vw, 58px); font-weight:600; color: var(--teal);
    font-variant-numeric: tabular-nums; margin: 8px 0 4px;
  }
  .population .sub{ font-size:12px; color:var(--teal); letter-spacing:0.05em; opacity:0.85; }

  /* category filter row */
  .categories{ display:flex; flex-direction:column; gap:14px; margin: 44px 0 40px; }
  .cat-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; }
  .cat-btn{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:8px;
    color: var(--ink-dim); font: inherit; cursor:pointer; text-align:left;
    padding: 10px 16px; min-width: 128px;
    transition: border-color 0.15s ease;
  }
  .cat-btn .cat-top{ display:flex; align-items:center; gap:8px; font-size:15px; }
  .cat-btn .cat-num{ font-size:10px; color:var(--ink-dim); letter-spacing:0.05em; }
  .cat-btn .cat-label{ display:block; margin-top:6px; font-size:11px; letter-spacing:0.1em; color:var(--ink); }
  .cat-btn.active{ border-color: var(--teal); }
  .cat-btn.active .cat-label{ color:var(--teal); }
  .cat-btn:hover{ border-color: var(--ink-dim); }
  @media (max-width: 640px){
    .categories{ margin: 34px 0 24px; }
    .cat-btn{ min-width: 42%; }
  }

  .grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 30px;
  }
  @media (max-width: 720px){ .grid{ grid-template-columns: repeat(2, 1fr);} }
  @media (max-width: 460px){ .grid{ grid-template-columns: 1fr;} }

  .card{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding: 22px 18px 18px; position:relative; overflow:hidden;
    text-align:center;
  }
  .card .icon{ font-size:22px; line-height:1; margin-bottom:10px; display:inline-block; }
  .card .icon-img{ width:26px; height:26px; object-fit:contain; display:inline-block; margin-bottom:10px; }
  .card .label{ font-size:11px; letter-spacing:0.14em; color:var(--ink-dim); text-transform:uppercase; }
  .card .row{ display:flex; align-items:flex-end; justify-content:center; gap:12px; margin-top:10px; }
  .card .value{
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(28px, 6vw, 40px); font-weight:600; margin: 0 0 4px;
    font-variant-numeric: tabular-nums; text-align:left;
  }
  .card .sub{ font-size:12px; color:var(--ink-dim); letter-spacing:0.06em; text-align:left; }
  .card .spark{ flex-shrink:0; opacity:0.9; margin-bottom: 6px; }

  /* bottom info grid */
  .bottom-grid{ display:grid; grid-template-columns: 1.7fr 1fr; gap:14px; margin-top:14px; }
  .side-col{ display:flex; flex-direction:column; gap:14px; }
  @media (max-width: 820px){ .bottom-grid{ grid-template-columns: 1fr; } }
  .panel{
    background: var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding: 18px 18px 20px;
  }
  .panel-title{ font-size:11px; letter-spacing:0.14em; color:var(--ink); text-transform:uppercase; display:flex; align-items:center; gap:7px; margin-bottom:14px; }
  .panel-title .dot{ width:6px; height:6px; border-radius:50%; background:var(--teal); animation: blink 1.6s ease-in-out infinite; }

  .map-panel .map-box{ width:100%; aspect-ratio: 89/45; }
  .map-panel .map-box svg{ width:100%; height:100%; display:block; }
  .map-panel .map-caption{ margin-top:12px; font-size:12px; color:var(--ink-dim); }
  .pulse-marker{ animation: mapblink 2.4s ease-in-out infinite; }
  @keyframes mapblink{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }

  .region-row{ display:flex; align-items:center; gap:10px; font-size:12px; margin-bottom:10px; }
  .region-row .rname{ width:92px; flex-shrink:0; color:var(--ink-dim); }
  .region-row .rbar-track{ flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .region-row .rbar-fill{ height:100%; border-radius:3px; }
  .region-row .rval{ width:52px; flex-shrink:0; text-align:right; color:var(--ink); }
  .region-row .rpct{ width:40px; flex-shrink:0; text-align:right; color:var(--ink-dim); }

  .trend-panel{ text-align:center; }
  .trend-panel .panel-title{ justify-content:flex-start; }
  .trend-panel .trend-spark{ width:100%; height:64px; margin: 4px 0 10px; }
  .trend-panel .trend-value{
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 26px; font-weight:600; color: var(--teal); font-variant-numeric: tabular-nums;
  }
  .trend-panel .trend-sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }

  .pulse-rule{ margin: 46px 0 14px; opacity:0.7; }
  .footer{ text-align:center; font-size:11px; letter-spacing:0.2em; color:var(--ink-dim); }

  @media (prefers-reduced-motion: reduce){
    .live .dot, .panel-title .dot, .pulse-marker{ animation:none; }
  }
</style>
</head>

const SUB_LABEL = { now: "/ sec", day: "today", week: "this week", month: "this month", year: "this year" };
let currentPeriod = "now";
let currentCategory = "overview";
const loadTime = Date.now();

// true cumulative value at a given instant, from the stat's reference point.
// This is the real world total — it never resets, regardless of the tab.
function computeValue(stat, now){
  const ref = new Date(stat.referenceTime).getTime();
  const elapsedSec = Math.max(0, (now - ref) / 1000);
  return stat.referenceValue + stat.perSecond * elapsedSec;
}

// NOW-mode counter: starts at exactly 0 the instant the page loads, and
// climbs using the stat's real perSecond rate from that moment on.
function sinceLoadValue(stat, now){
  const elapsedSec = Math.max(0, (now - loadTime) / 1000);
  return stat.perSecond * elapsedSec;
}

function periodStart(period, now){
  const d = new Date(now);
  d.setUTCHours(0, 0, 0, 0);
  if (period === "day") return d.getTime();
  if (period === "week"){
    const day = d.getUTCDay();
    const diffToMonday = (day === 0 ? 6 : day - 1);
    d.setUTCDate(d.getUTCDate() - diffToMonday);
    return d.getTime();
  }
  if (period === "month"){ d.setUTCDate(1); return d.getTime(); }
  if (period === "year"){ d.setUTCMonth(0, 1); return d.getTime(); }
  return now;
}

function displayValue(stat, now){
  if (currentPeriod === "now") return sinceLoadValue(stat, now);
  const since = periodStart(currentPeriod, now);
  return computeValue(stat, now) - computeValue(stat, since);
}

function formatInt(n){
  return Math.floor(Math.max(0, n)).toLocaleString('en-US');
}

function iconHTML(icon){
  if (/\.(svg|png|jpe?g|webp)$/i.test(icon)){
    return `<img src="${icon}" class="icon-img" alt="">`;
  }
  return `<span class="icon">${icon}</span>`;
}

/* ---- decorative sparkline (seeded, deterministic, drawn once) ---- */
function seededRandom(seed){
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function(){
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function hashStr(str){
  let h = 0;
  for (let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h) || 1;
}
function sparklineSVG(id, color, w, h){
  const rand = seededRandom(hashStr(id));
  const points = 14;
  const pts = [];
  for (let i = 0; i < points; i++){
    const trend = i / (points - 1);           // gentle upward slope
    const noise = (rand() - 0.5) * 0.35;       // seeded wiggle
    const yNorm = Math.min(1, Math.max(0, trend * 0.75 + noise + 0.15));
    const x = (i / (points - 1)) * w;
    const y = h - yNorm * h;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </svg>`;
}

/* ---- trend of the day (real 24h delta of world population) ---- */
document.getElementById('trendSpark').innerHTML =
  sparklineSVG('trend-of-the-day', '#8fd694', 200, 60)
    .replace(/<svg[^>]*>|<\/svg>/g, ''); // reuse just the polyline, sized by parent viewBox

/* ---- time tabs ---- */
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentPeriod = btn.dataset.period;
});

function render(){
  const now = Date.now();

  CONFIG.stats.forEach(stat => {
    const c = cards[stat.id];
    const prefix = stat.prefix || '';
    c.valueEl.textContent = prefix + formatInt(displayValue(stat, now));
    c.subEl.textContent = SUB_LABEL[currentPeriod];
  });

  const pop = CONFIG.population;
  document.getElementById('popValue').textContent = formatInt(displayValue(pop, now));
  document.getElementById('popSub').textContent = SUB_LABEL[currentPeriod];

  // real, live-computed 24h population delta
  const delta24h = computeValue(pop, now) - computeValue(pop, now - 24 * 3600 * 1000);
  document.getElementById('trendValue').textContent = '+' + formatInt(delta24h);

  const d = new Date(now);
  const useUTC = CONFIG.timezone === 'UTC';
  const h = String(useUTC ? d.getUTCHours() : d.getHours()).padStart(2, '0');
  const m = String(useUTC ? d.getUTCMinutes() : d.getMinutes()).padStart(2, '0');
  const s = String(useUTC ? d.getUTCSeconds() : d.getSeconds()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}:${s}`;
  document.getElementById('tz').textContent = useUTC ? 'UTC' : Intl.DateTimeFormat().resolvedOptions().timeZone;

  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: useUTC ? 'UTC' : undefined };
  document.getElementById('dateRow').textContent = d.toLocaleDateString('en-US', opts).toUpperCase();

  requestAnimationFrame(render);
}

/* ---- pulsing markers over the static map (pure decoration) ---- */
const PULSE_MARKERS = [
  { x: 26.2, y: 12.3 }, // New York
  { x: 44.5, y: 9.6 },  // London
  { x: 45.3, y: 20.9 }, // Lagos
  { x: 62.5, y: 17.8 }, // Mumbai
  { x: 79.0, y: 13.6 }, // Tokyo
  { x: 33.0, y: 28.4 }, // São Paulo
  { x: 81.8, y: 31.0 }, // Sydney
  { x: 52.2, y: 15.0 }  // Cairo
];
(function addPulseMarkers(){
  const svg = document.querySelector('#mapBox svg');
  if (!svg) return;
  PULSE_MARKERS.forEach((p, i) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x);
    c.setAttribute('cy', p.y);
    c.setAttribute('r', 0.9);
    c.setAttribute('fill', '#4fd6c4');
    c.classList.add('pulse-marker');
    c.style.animationDelay = (i * 0.3) + 's';
    svg.appendChild(c);
  });
})();

applyCategoryFilter();
requestAnimationFrame(render);
</script>
</body>
